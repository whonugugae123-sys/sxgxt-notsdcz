<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="640" height="230" rx="12" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333">대장균 DNA 복제 중 지연가닥이 형성되는 모습</text>
  <!-- 주형 가닥 (긴 아래 가닥) -->
  <rect x="40" y="118" width="540" height="10" rx="2" fill="#7a7a7a"/>
  <!-- 새 가닥: 왼쪽 50nt -->
  <rect x="40" y="100" width="100" height="10" rx="2" fill="#bdbdbd" stroke="#888" stroke-width="1"/>
  <!-- 염기쌍 눈금 -->
  <g stroke="#9a9a9a" stroke-width="1">
    <line x1="50" y1="110" x2="50" y2="118"/><line x1="62" y1="110" x2="62" y2="118"/><line x1="74" y1="110" x2="74" y2="118"/><line x1="86" y1="110" x2="86" y2="118"/><line x1="98" y1="110" x2="98" y2="118"/><line x1="110" y1="110" x2="110" y2="118"/><line x1="122" y1="110" x2="122" y2="118"/><line x1="134" y1="110" x2="134" y2="118"/>
    <line x1="350" y1="110" x2="350" y2="118"/><line x1="362" y1="110" x2="362" y2="118"/>
    <line x1="374" y1="110" x2="374" y2="118"/><line x1="386" y1="110" x2="386" y2="118"/><line x1="398" y1="110" x2="398" y2="118"/><line x1="410" y1="110" x2="410" y2="118"/><line x1="422" y1="110" x2="422" y2="118"/><line x1="434" y1="110" x2="434" y2="118"/><line x1="446" y1="110" x2="446" y2="118"/><line x1="458" y1="110" x2="458" y2="118"/><line x1="470" y1="110" x2="470" y2="118"/><line x1="482" y1="110" x2="482" y2="118"/><line x1="494" y1="110" x2="494" y2="118"/><line x1="506" y1="110" x2="506" y2="118"/><line x1="518" y1="110" x2="518" y2="118"/><line x1="530" y1="110" x2="530" y2="118"/><line x1="542" y1="110" x2="542" y2="118"/><line x1="554" y1="110" x2="554" y2="118"/><line x1="566" y1="110" x2="566" y2="118"/><line x1="576" y1="110" x2="576" y2="118"/>
  </g>
  <!-- 프라이머 10nt -->
  <rect x="340" y="99" width="30" height="12" rx="2" fill="#111"/>
  <!-- 프라이머 뒤 40nt -->
  <rect x="370" y="100" width="210" height="10" rx="2" fill="#bdbdbd" stroke="#888" stroke-width="1"/>
  <!-- DNA 중합효소 III -->
  <circle cx="140" cy="108" r="26" fill="#d9d9d9" fill-opacity="0.75" stroke="#999"/>
  <text x="140" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="#222">DNA 중합효소 Ⅲ</text>
  <line x1="140" y1="72" x2="140" y2="82" stroke="#555"/>
  <text x="355" y="74" text-anchor="middle" font-size="20" font-weight="700" fill="#222">프라이머</text>
  <line x1="355" y1="80" x2="355" y2="97" stroke="#555"/>
  <!-- A -->
  <text x="596" y="119" font-size="25" font-weight="700" fill="#222">A</text>
  <!-- 길이 표시 -->
  <g stroke="#444" stroke-width="1" fill="none">
    <line x1="40" y1="138" x2="40" y2="160"/><line x1="140" y1="138" x2="140" y2="160"/><line x1="340" y1="138" x2="340" y2="160"/><line x1="370" y1="138" x2="370" y2="160"/><line x1="580" y1="138" x2="580" y2="160"/>
    <line x1="40" y1="152" x2="140" y2="152"/><line x1="140" y1="152" x2="340" y2="152"/><line x1="370" y1="152" x2="580" y2="152"/>
  </g>
  <g font-size="20" font-weight="700" fill="#222" text-anchor="middle">
    <text x="90" y="148">50nt</text><text x="240" y="148">100nt</text><text x="355" y="184">10nt</text><text x="475" y="148">40nt</text>
  </g>
  <text x="320" y="216" text-anchor="middle" font-size="15" fill="#555">(nt: 뉴클레오타이드 · 그림에 없는 나머지 DNA는 고려하지 않음)</text>
</svg>
